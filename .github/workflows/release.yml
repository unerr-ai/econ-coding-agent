name: Release

# One flow, triggered by a `v*` tag push:
#   build-binaries (5 targets) → publish (npm, gate) → promote (npm latest, gate)
#
# econ ships to npm ONLY, via the wrapper + per-platform-binary pattern (see
# packaging/npm/). There is no GitHub-Release / Homebrew / Scoop channel.
#
# The version always equals the tag (v0.1.0 → 0.1.0). A tag containing `-`
# (e.g. v0.1.0-beta.1) is a prerelease: published under the durable `beta`
# dist-tag and never promoted to `latest`.

on:
  push:
    tags: ['v*']

jobs:
  # -------------------------------------------------------------------------
  # Compile the self-contained econ binaries (5 targets) and upload each as a
  # raw artifact (renamed opencode -> econ-<target>) for the npm packaging job.
  #
  # build.ts (packages/opencode/script/build.ts) is reused verbatim:
  #   --single       build only the native-platform target
  #   --skip-install skip the extra bun install --os="*" --cpu="*" steps (safe
  #                  for native builds; setup-bun already installed the
  #                  current-platform native modules)
  # The linux matrix entry builds ALL targets (no --single) so linux-arm64 is
  # cross-compiled alongside linux-x64 in one pass.
  # -------------------------------------------------------------------------
  build-binaries:
    name: binary / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-14
            os: darwin
            single: true
          - label: darwin-x64
            runner: macos-13
            os: darwin
            single: true
          - label: linux
            runner: ubuntu-latest
            os: linux
            single: false
          - label: windows-x64
            runner: windows-latest
            os: windows
            single: true

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Derive version from tag (strip leading v)
      - name: Set version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary (Unix single)
        if: ${{ matrix.single && matrix.os != 'windows' }}
        working-directory: packages/opencode
        run: bun run script/build.ts --single --skip-install
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}

      - name: Build binary (Linux — all targets)
        if: ${{ !matrix.single && matrix.os == 'linux' }}
        working-directory: packages/opencode
        run: bun run script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}

      - name: Build binary (Windows single)
        if: ${{ matrix.single && matrix.os == 'windows' }}
        working-directory: packages/opencode
        shell: pwsh
        run: bun run script/build.ts --single --skip-install
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}

      # -----------------------------------------------------------------------
      # Stage the raw binary as dist/bin/econ-<target>[.exe] — the exact input
      # names build-npm-packages.mjs expects. One artifact per target; the
      # publish job merges them all into a single dist/bin.
      # -----------------------------------------------------------------------
      - name: Stage econ-darwin-arm64
        if: ${{ matrix.label == 'darwin-arm64' }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          cp packages/opencode/dist/opencode-darwin-arm64/bin/opencode dist/bin/econ-darwin-arm64
          echo "=== smoke test ==="
          packages/opencode/dist/opencode-darwin-arm64/bin/opencode --version

      - name: Stage econ-darwin-x64
        if: ${{ matrix.label == 'darwin-x64' }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          cp packages/opencode/dist/opencode-darwin-x64/bin/opencode dist/bin/econ-darwin-x64
          echo "=== smoke test ==="
          packages/opencode/dist/opencode-darwin-x64/bin/opencode --version

      - name: Stage econ-linux-x64 + econ-linux-arm64
        if: ${{ matrix.label == 'linux' }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          cp packages/opencode/dist/opencode-linux-x64/bin/opencode   dist/bin/econ-linux-x64
          cp packages/opencode/dist/opencode-linux-arm64/bin/opencode dist/bin/econ-linux-arm64
          echo "=== smoke test (linux-x64 native) ==="
          packages/opencode/dist/opencode-linux-x64/bin/opencode --version
          echo "(linux-arm64 is cross-compiled; smoke test skipped on x64 runner)"

      - name: Stage econ-windows-x64
        if: ${{ matrix.label == 'windows-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item packages\opencode\dist\opencode-windows-x64\bin\opencode.exe dist\bin\econ-windows-x64.exe
          Write-Host "=== smoke test ==="
          & "packages\opencode\dist\opencode-windows-x64\bin\opencode.exe" --version

      - name: Upload raw binary (npm packaging input)
        uses: actions/upload-artifact@v4
        with:
          name: rawbin-${{ matrix.label }}
          path: dist/bin/econ-*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job — publish the tagged version to npm under a temporary `pending`
  # dist-tag (MANUAL APPROVAL #1). The wrapper + 5 platform packages are staged
  # by packaging/npm/build-npm-packages.mjs; platform packages publish first so
  # the wrapper's optionalDependencies resolve immediately.
  # -------------------------------------------------------------------------
  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    # Manual-approval gate #1: requires a GitHub Environment named "npm-publish"
    # with a required reviewer (Settings → Environments).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Only packaging/npm/ + the root package.json are needed here.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Derive version + dist-tag from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A tag containing `-` is a prerelease → durable `beta` dist-tag,
          # never promoted to `latest`. Stable tags use the temporary `pending`
          # tag, which the promote gate flips to `latest`.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "Publishing PRERELEASE $VERSION under dist-tag: beta"
          else
            echo "dist_tag=pending" >> "$GITHUB_OUTPUT"
            echo "Publishing STABLE $VERSION under dist-tag: pending"
          fi

      - name: Download compiled binaries
        # rawbin-* artifacts each carry dist/bin/econ-<target>[.exe];
        # merge-multiple lands them all in dist/bin for the packaging script.
        uses: actions/download-artifact@v4
        with:
          pattern: rawbin-*
          merge-multiple: true
          path: dist/bin

      - name: Stage npm packages (wrapper + 5 platform binaries)
        run: |
          chmod +x dist/bin/econ-darwin-x64 dist/bin/econ-darwin-arm64 \
                   dist/bin/econ-linux-x64 dist/bin/econ-linux-arm64 || true
          ls -lh dist/bin
          node packaging/npm/build-npm-packages.mjs "${{ steps.version.outputs.version }}"
        env:
          # Optional: bake a default OpenRouter key into the wrapper. Leave the
          # secret UNSET to ship no bundled key. SECURITY: only set this if econ
          # is published private OR the key is dedicated + spend-capped — a
          # bundled key in a public package is world-readable. See packaging/npm/README.md.
          ECON_BUNDLED_OPENROUTER_KEY: ${{ secrets.ECON_BUNDLED_OPENROUTER_KEY }}

      - name: Publish to npm (${{ steps.version.outputs.dist_tag }} dist-tag)
        # Platform packages first, then the wrapper — npm resolves the wrapper's
        # optionalDependencies at install time.
        run: |
          DIST_TAG="${{ steps.version.outputs.dist_tag }}"
          for d in packaging/npm/dist/@unerr-ai/econ-*; do
            echo "publishing $d under @$DIST_TAG"
            npm publish "$d" --access public --tag "$DIST_TAG"
          done
          echo "publishing wrapper packaging/npm/dist/@unerr-ai/econ under @$DIST_TAG"
          npm publish packaging/npm/dist/@unerr-ai/econ --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # Job — promote the just-published version from `pending` to `latest`
  # (MANUAL APPROVAL #2). SKIPPED for prereleases (tag contains `-`).
  # -------------------------------------------------------------------------
  promote:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Manual-approval gate #2: a SEPARATE GitHub Environment named "npm-promote"
    # with its own required reviewer.
    environment: npm-promote

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Promote pending → latest
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          for pkg in \
            @unerr-ai/econ \
            @unerr-ai/econ-darwin-x64 \
            @unerr-ai/econ-darwin-arm64 \
            @unerr-ai/econ-linux-x64 \
            @unerr-ai/econ-linux-arm64 \
            @unerr-ai/econ-windows-x64; do
            echo "promoting $pkg@$VERSION"
            npm dist-tag add "$pkg@$VERSION" latest
            npm dist-tag rm  "$pkg@$VERSION" pending
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
